server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Nginx Temp Paths (Required for Read-Only FS)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Security Headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://challenges.cloudflare.com;" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Raiz onde o build do React estará
    root /usr/share/nginx/html;
    index index.html;
    
    # Compressão Gzip para performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # Tenta servir o arquivo solicitado, se não existir, joga pro index.html (SPA)
        try_files $uri $uri/ /index.html;
    }

    # Cache de arquivos estáticos (1 ano)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|svg)$ {
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
    }

    # Bloqueia acesso a arquivos ocultos
    location ~ /\. {
        deny all;
    }
}
